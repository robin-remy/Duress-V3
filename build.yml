name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar plataforma y build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generar Gradle wrapper (8.7)
        run: gradle wrapper --gradle-version 8.7

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: duress-admin-spike-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en release (descarga directa desde el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spike-latest
          name: DURESS Admin Spike - ultima build
          files: app/build/outputs/apk/debug/app-debug.apk
