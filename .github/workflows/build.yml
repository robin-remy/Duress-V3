name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar SDK y qrencode
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sudo apt-get update && sudo apt-get install -y qrencode

      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "Keystore restaurado desde el secreto."
          else
            echo "No hay secreto KEYSTORE_BASE64. Generando uno temporal."
            keytool -genkeypair -v -keystore release.jks -alias duress \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass duresspass -keypass duresspass \
              -dname "CN=DURESS Spike, O=DURESS, C=ES"
            echo "==================================================="
            echo ">>> GUARDA ESTO como secreto KEYSTORE_BASE64:"
            echo "---------------------------------------------------"
            base64 -w0 release.jks
            echo ""
            echo "==================================================="
          fi

      - name: Calcular checksum de firma
        run: |
          keytool -exportcert -keystore release.jks -alias duress -storepass duresspass -file cert.der
          CHECKSUM=$(openssl dgst -sha256 -binary cert.der | openssl base64 -A | tr -d '=' | tr '+/' '-_')
          echo "SIGNATURE_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "Checksum: $CHECKSUM"

      - name: Compilar APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: duresspass
          KEY_ALIAS: duress
          KEY_PASSWORD: duresspass
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Generar QR de provisioning
        run: |
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/spike-latest/app-debug.apk"
          printf '{"android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME":"com.duress.adminspike/.DuressAdminReceiver","android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM":"%s","android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION":"%s","android.app.extra.PROVISIONING_LEAVE_ALL_SYSTEM_APPS_ENABLED":true}' "$SIGNATURE_CHECKSUM" "$APK_URL" > provisioning.json
          echo "----- provisioning.json -----"
          cat provisioning.json
          qrencode -o provisioning-qr.png -s 8 -m 3 "$(cat provisioning.json)"

      - name: Publicar APK y QR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spike-latest
          name: DURESS DO Spike - ultima build
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            provisioning-qr.png
